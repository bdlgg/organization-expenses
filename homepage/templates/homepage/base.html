<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Учёт расходов организации{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
        body { background: #f5f6f8; color: #20242b; }
        .navbar-brand { font-weight: 600; letter-spacing: -0.02em; }
        .page-panel { background: #fff; border: 1px solid #e1e4e8; }
        .stat-value { font-size: clamp(1.35rem, 3vw, 2rem); font-weight: 600; }
        .table thead th { color: #606874; font-size: .84rem; font-weight: 600; }
        .form-label { font-size: .9rem; font-weight: 500; }
        footer { color: #6b7280; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">
        <a class="navbar-brand" href="{% url 'homepage:index' %}">
            Учёт расходов
        </a>
        <div class="navbar-nav flex-row flex-wrap gap-1 gap-md-2">
            <a class="nav-link" href="{% url 'expenses:expense_list' %}">
                Расходы
            </a>
            <a class="nav-link" href="{% url 'expenses:expense_statistics' %}">
                Статистика
            </a>
            <a class="nav-link" href="{% url 'catalogs:categories' %}">
                Категории
            </a>
            <a class="nav-link" href="{% url 'catalogs:departments' %}">
                Подразделения
            </a>
            <a class="nav-link" href="{% url 'catalogs:documents' %}">
                Документы
            </a>
        </div>
    </div>
</nav>
<main class="container py-4 py-lg-5">
    {% block content %}{% endblock %}
</main>
<footer class="container py-4 border-top small">
    Система учёта расходов организации · Django · SQLite
</footer>
</body>
</html>
